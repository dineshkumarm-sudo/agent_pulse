name: Agent Pulse Email Monitoring

on:
  schedule:
    # Daily report Monday to Friday at 19:00 IST (13:30 UTC).
    - cron: "30 13 * * 1-5"
    # Weekly target check Saturday at 07:30 IST (02:00 UTC).
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-pulse-email-monitor
  cancel-in-progress: false

jobs:
  daily-report:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install monitoring dependencies
        run: python -m pip install --upgrade pip pandas gspread google-auth requests
      - name: Email daily report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONITOR_MODE: daily
        run: python -m src.background_monitor

  weekly-target-check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install monitoring dependencies
        run: python -m pip install --upgrade pip pandas gspread google-auth requests
      - name: Email weekly target alert
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONITOR_MODE: weekly
        run: python -m src.background_monitor
