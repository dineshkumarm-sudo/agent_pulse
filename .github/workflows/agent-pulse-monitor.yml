name: Agent Pulse Teams Monitoring

on:
  schedule:
    # Daily report at 19:00 IST (13:30 UTC).
    - cron: "30 13 * * *"
    # Weekly target check Saturday at 09:00 IST (03:30 UTC).
    - cron: "30 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-pulse-teams-monitor
  cancel-in-progress: false

jobs:
  daily-report:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install monitoring dependencies
        run: python -m pip install --upgrade pip pandas gspread google-auth requests
      - name: Send daily report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TEAMS_WORKFLOW_WEBHOOK_URL: ${{ secrets.TEAMS_WORKFLOW_WEBHOOK_URL }}
          MONITOR_MODE: daily
        run: python -m src.background_monitor

  weekly-target-check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install monitoring dependencies
        run: python -m pip install --upgrade pip pandas gspread google-auth requests
      - name: Check weekly target
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TEAMS_WORKFLOW_WEBHOOK_URL: ${{ secrets.TEAMS_WORKFLOW_WEBHOOK_URL }}
          MONITOR_MODE: weekly
        run: python -m src.background_monitor
